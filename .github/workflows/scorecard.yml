name: Scorecard supply-chain security

# Runs the OpenSSF Scorecard checks and uploads results to the GitHub
# Security tab (code scanning / SARIF). Results are NOT published to the
# public OpenSSF API (publish_results: false), so there is intentionally
# no Scorecard badge.
#
# All third-party actions are SHA-pinned. Actions billing is currently
# disabled on this repo, so this workflow is staged and will run once
# billing is enabled.

on:
  branch_protection_rule:
  schedule:
    - cron: '32 7 * * 1' # weekly, Mondays 07:32 UTC
  push:
    branches: [chore/rebrand-suwappu] # default branch

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false # no public badge / OpenSSF API submission

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
