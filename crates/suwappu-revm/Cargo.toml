[package]
name = "suwappu-revm"
description = "Suwappu-specific REVM implementation"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
rust-version.workspace = true
keywords = ["suwappu", "evm", "revm", "ethereum", "blockchain"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# revm
revm.workspace = true
revm-interpreter.workspace = true
auto_impl.workspace = true

# alloy
alloy-sol-types.workspace = true

# Suwappu DAG on-chain PQ: native ML-DSA-65 (FIPS 204) verifier wired in as the
# 0x0101 precompile (P5b). Pinned to the published git tag on Suwappu-Labs/suwappu-dag
# (token auth via the git credential helper), same pattern as the suwappu-db
# state-substrate dependency — builds from a clean checkout, no sibling dir needed.
suwappu-mldsa-precompile = { git = "https://github.com/Suwappu-Labs/suwappu-dag.git", tag = "v0.3.0" }

# BLAKE3 (0x0102 precompile): the hash Suwappu-DAG uses for consensus certificate /
# vote digests — needed on-chain so a consensus verifier can recompute a cert
# digest before ML-DSA-verifying it (the EVM has no BLAKE3 opcode).
blake3 = { version = "1", default-features = false }

# Optional
serde = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
# Real ML-DSA-65 keygen/sign for the 0x0101 precompile functional test.
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst", "optional_no_base_fee", "memory_limit"]
std = ["serde?/std", "revm/std", "alloy-sol-types/std"]
serde = ["dep:serde", "revm/serde"]
portable = ["revm/portable"]
c-kzg = ["revm/c-kzg"]
secp256k1 = ["revm/secp256k1"]
blst = ["revm/blst"]

# Dev features for testing
dev = [
    "memory_limit",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
