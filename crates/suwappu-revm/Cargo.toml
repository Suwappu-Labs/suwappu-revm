[package]
name = "suwappu-revm"
description = "Suwappu-specific REVM implementation"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
categories.workspace = true
rust-version.workspace = true
keywords = ["suwappu", "evm", "revm", "ethereum", "blockchain"]
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# revm
revm.workspace = true
revm-interpreter.workspace = true
auto_impl.workspace = true

# alloy
alloy-sol-types.workspace = true

# Suwappu DAG on-chain PQ: native ML-DSA-65 (FIPS 204) verifier wired in as the
# 0x0101 precompile (P5b). Path dep for local builds (gsx-dag as a sibling
# checkout); production/CI should pin the git dep on Suwappu-Labs/suwappu-dag with
# token auth, same pattern as the suwappu-db state-substrate dependency.
suwappu-mldsa-precompile = { path = "../../../gsx-dag/crates/suwappu-mldsa-precompile" }

# Optional
serde = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
# Real ML-DSA-65 keygen/sign for the 0x0101 precompile functional test.
pqcrypto-mldsa = "0.1"
pqcrypto-traits = "0.3"

[features]
default = ["std", "c-kzg", "secp256k1", "portable", "blst", "optional_no_base_fee", "memory_limit"]
std = ["serde?/std", "revm/std", "alloy-sol-types/std"]
serde = ["dep:serde", "revm/serde"]
portable = ["revm/portable"]
c-kzg = ["revm/c-kzg"]
secp256k1 = ["revm/secp256k1"]
blst = ["revm/blst"]

# Dev features for testing
dev = [
    "memory_limit",
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_no_base_fee",
]
memory_limit = ["revm/memory_limit"]
optional_balance_check = ["revm/optional_balance_check"]
optional_block_gas_limit = ["revm/optional_block_gas_limit"]
optional_no_base_fee = ["revm/optional_no_base_fee"]
