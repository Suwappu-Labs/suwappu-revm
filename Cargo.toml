[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
authors = [""]
license = "MIT"
repository = "https://github.com/GlobalSettlementNetwork/gsx-revm"
documentation = "https://docs.rs/gsx-revm"
categories = ["cryptography::cryptocurrencies"]

[workspace.lints.rust]
missing-debug-implementations = "warn"
missing-docs = "warn"
unreachable-pub = "warn"
unused-must-use = "deny"
rust-2018-idioms = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing-const-for-fn = "warn"
use-self = "warn"
redundant-clone = "warn"

[workspace.dependencies]
gsx-revm = { version = "0.2.0", path = "crates/gsx-revm", default-features = false }

# revm
revm = { version = "34.0.0", default-features = false }
revm-interpreter = { version = "32.0.0", default-features = false }
auto_impl = "1"

# alloy
alloy-sol-types = { version = "1.5", default-features = false }

# misc
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
rstest = "0.24"
